name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test (protocol, crypto, worker in workerd, client, cli, model, app)
        run: pnpm test
      - name: Build the libraries, web app and CLI
        run: pnpm build:all
      - name: Pack the libraries and CLI, install them outside the workspace, import and type-check
        run: pnpm pack:check
      - name: Release dry run (the npm publish step of the release workflow, without uploading)
        run: pnpm release:publish --dry-run --no-build
      - name: Validate the Cloudflare deployment config
        run: pnpm exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/wrangler-out"
      - name: Deploy-script dry run
        run: node tools/deploy/deploy.mjs --dry-run
      - name: Dependency audit (production, high and above)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

  e2e:
    name: Whole-system test (real Worker, desktop client and PWA in Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chromium
        run: pnpm --filter @daintreehq/decisions-e2e exec playwright-core install --with-deps chromium
      - run: pnpm --filter @daintreehq/decisions-e2e test
